<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Admin - Lotto90</title>
    <script src="https://socket.io"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #fff; text-align: center; padding: 20px; }
        .pannel { background-color: #1c1c1c; max-width: 500px; margin: 20px auto; padding: 25px; border-radius: 8px; border: 2px solid #ff9100; }
        button { width: 95%; padding: 15px; background-color: #ff9100; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; text-transform: uppercase; }
        .btn-action { background-color: #00e676; padding: 6px 12px; margin: 5px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .box-list { background-color: #262626; padding: 15px; border-radius: 6px; text-align: left; margin-top: 15px; border-left: 4px solid #ff9100; }
        .alert-box { background-color: #2c0c0c; border: 2px solid #ff1744; padding: 15px; border-radius: 8px; margin-top: 20px; display: none; text-align: left; }
    </style>
</head>
<body>
    <div class="pannel">
        <h2>🔧 DASHBOARD ADMIN - PATRICK</h2>
        <p>Laharana Admin: <b>0341830322</b></p>
        <hr style="border-color:#333;">
        <button onclick="tirerBoule()">🔴 HITARI-TSIRA BAOLINA (RNG)</button>
        <div class="box-list">
            <h3>📥 Fangatahana Dépôt Mvola</h3>
            <div id="liste-depots"><p style="color:#777;">Tsy misy fangatahana aloha izao...</p></div>
        </div>
        <div class="alert-box" id="box-alerte">
            <h3 style="color:#ff1744;">🚨 ALERTE: MISY NAHAZO!</h3>
            <p>Mpilalao: <span id="gagnant-name" style="color:#00e676; font-weight:bold;">-</span></p>
            <p>Vola halefa (40%): <span id="gagnant-gain" style="color:#ffeb3b; font-weight:bold;">0</span> Ar</p>
            <button onclick="validerFinLalao()" style="background-color:#d32f2f; color:#fff;">Hanaiky & Hamerina Lalao ho 0</button>
        </div>
    </div>
    <script>
        const socket = io(); // Natao banga mandeha ho azy
        let laharanaGagnant = "";

        socket.on('game-over', (data) => {
            laharanaGagnant = data.phone;
            document.getElementById('gagnant-name').innerText = data.winner;
            document.getElementById('gagnant-gain').innerText = (data.jackpot * 0.40) + " Ar";
            document.getElementById('box-alerte').style.display = 'block';
        });

        socket.on('recevoir-depot-admin', (data) => {
            const zone = document.getElementById('liste-depots');
            if(zone.innerHTML.includes("Tsy misy")) zone.innerHTML = "";
            zone.innerHTML += `<div id="dep-${data.phone}" style="margin-bottom:10px; border-bottom:1px solid #444;">
                Mpilalao: <b>${data.phone}</b> (${data.montant} Ar) 
                <button class="btn-action" onclick="accepterDepot('${data.phone}', ${data.montant})">Accepter</button>
            </div>`;
        });

        function tirerBoule() { fetch('/api/loto/tirage', { method: 'POST' }); }
        
        function accepterDepot(phone, montant) {
            fetch('/api/depot', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone, montant })
            }).then(() => {
                document.getElementById(`dep-${phone}`).remove();
                socket.emit('maj-solde-force', { phone });
            });
        }
        function validerFinLalao() {
            fetch('/api/admin/payer', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ joueurPhone: laharanaGagnant })
            }).then(() => { document.getElementById('box-alerte').style.display = 'none'; });
        }
    </script>
</body>
</html>
