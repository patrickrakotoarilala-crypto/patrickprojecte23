<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lotto90 Madagascar</title>
    <script src="https://socket.io"></script>
    <style>
        :root {
            --gasy-red: #ff1744;
            --gasy-green: #00e676;
            --bg-dark: #121212;
            --bg-card: #1c1c1c;
            --wood: #4e342e;
        }
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: var(--bg-dark); color: #fff; margin: 0; padding: 0; }
        .barre-top { background-color: var(--wood); padding: 12px; display: flex; justify-content: space-between; border-bottom: 3px solid var(--gasy-green); font-weight: bold; }
        .zone-boule { background-color: #161616; padding: 15px; display: flex; justify-content: center; align-items: center; gap: 15px; }
        .boule-rng { width: 55px; height: 55px; background: radial-gradient(circle, #fff, #ff9100); color: #000; font-size: 26px; font-weight: bold; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .layout-lehibe { padding: 15px; max-width: 460px; margin: 0 auto; }
        .box-pannel { background-color: var(--bg-card); padding: 20px; border-radius: 10px; margin-bottom: 15px; border-left: 5px solid var(--gasy-red); }
        input { width: 88%; padding: 12px; margin: 8px 0; background: #262626; border: 1px solid #333; color: #fff; text-align: center; border-radius: 5px; }
        button { width: 94%; padding: 12px; background-color: var(--gasy-green); color: #000; font-weight: bold; border: none; border-radius: 5px; cursor: pointer; text-transform: uppercase; }
        .grille-container { background-color: #0d2112; border: 3px solid var(--gasy-green); border-radius: 8px; padding: 8px; margin-top: 15px; }
        .tsipika-9 { display: grid; grid-template-columns: repeat(9, 1fr); gap: 4px; margin-bottom: 4px; }
        .case-9 { background-color: #1e1e1e; padding: 10px 0; font-weight: bold; text-align: center; border-radius: 4px; border: 1px solid #333; }
        .case-9.banga { background-color: #2c0c0c; border: none; }
        .case-9.lany { background: radial-gradient(circle, #fff, var(--gasy-green)); color: #000; }
    </style>
</head>
<body>
    <div class="barre-top">
        <div>🇲🇬 Lotto90 En Ligne</div>
        <div>Solde: <span id="lbl-solde">0</span> Ar</div>
    </div>
    <div class="barre-top" style="background-color:#2c1d1a; border:none; font-size:14px;">
        <div id="lbl-anarana">Kaonty Vahiny</div>
        <div style="color:#ffeb3b;">🏆 Cagnotte: <span id="lbl-cagnotte">0</span> Ar</div>
    </div>
    <div class="zone-boule">
        <div style="background-color: var(--gasy-green); color:#000; padding:4px; font-weight:bold;">QUINE</div>
        <div class="boule-rng" id="lbl-baolina">--</div>
        <div style="background-color: #ff9100; color:#000; padding:4px; font-weight:bold;">PLEIN</div>
    </div>
    <div class="layout-lehibe">
        <div class="box-pannel" id="pan-auth">
            <h3>Inscription (Lotto90)</h3>
            <input type="text" id="in-pseudo" placeholder="Votre Pseudo / Nom">
            <input type="text" id="in-phone" placeholder="Numéro Phone (Mvola)">
            <button onclick="hanaoInscription()">Rejoindre la table</button>
        </div>
        <div class="box-pannel" id="pan-lalao" style="display:none;">
            <h3>Fampidirana Vola Mvola</h3>
            <input type="number" id="in-depot" placeholder="Montant du Dépôt MGA">
            <button onclick="hanaoDepot()">Faire un Dépôt Mvola</button>
            <hr style="border-color:#333; margin:15px 0;">
            <h3>Acheter des cartes</h3>
            <input type="number" id="in-isa-karatra" placeholder="Quantité de cartes (1-6)" max="6" min="1">
            <button onclick="hividyKaratra()" style="background-color: var(--gasy-red); color:#fff;">Parier et Acheter (200 Ar/u)</button>
        </div>
        <div id="zone-mes-grilles"></div>
    </div>
    <script>
        const socket = io(); // Natao banga mba handray ny rohy Render mandeha ho azy
        let monPhone = "", mesCartes = [];

        socket.on('game-info', (data) => { document.getElementById('lbl-cagnotte').innerText = data.jackpot; });
        socket.on('update-jackpot', (data) => { document.getElementById('lbl-cagnotte').innerText = data.jackpot; });
        socket.on('number-drawn', (data) => {
            document.getElementById('lbl-baolina').innerText = data.number;
            actualiserGrillesDisplay(data.history);
        });
        socket.on('game-over', (data) => { alert("🚨 PARTIE TERMINÉE ! Gagnant : " + data.winner); });
        socket.on('game-reset', (data) => {
            document.getElementById('lbl-baolina').innerText = "--";
            document.getElementById('zone-mes-grilles').innerHTML = "";
            document.getElementById('lbl-cagnotte').innerText = "0";
        });
        socket.on('maj-solde-joueur', (data) => { if(data.phone === monPhone) document.getElementById('lbl-solde').innerText = data.balance; });

        function hanaoInscription() {
            const pseudo = document.getElementById('in-pseudo').value;
            const phone = document.getElementById('in-phone').value;
            fetch('/api/inscription', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ pseudo, phone })
            }).then(res => res.json()).then(data => {
                if(data.success) {
                    monPhone = phone;
                    document.getElementById('lbl-anarana').innerText = pseudo;
                    document.getElementById('lbl-solde').innerText = data.balance;
                    document.getElementById('pan-auth').style.display = 'none';
                    document.getElementById('pan-lalao').style.display = 'block';
                }
            });
        }
        function hanaoDepot() {
            const mnt = document.getElementById('in-depot').value;
            socket.emit('demande-depot-admin', { phone: monPhone, montant: mnt });
            alert("Nalefa ny fangatahana dépôt!");
        }
        function hividyKaratra() {
            const qty = document.getElementById('in-isa-karatra').value;
            fetch('/api/acheter-carte', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone: monPhone, quantite: qty })
            }).then(res => res.json()).then(data => {
                if(data.success) {
                    document.getElementById('lbl-solde').innerText = data.balance;
                    mesCartes = data.cards;
                    actualiserGrillesDisplay([]);
                } else { alert(data.error); }
            });
        }
        function actualiserGrillesDisplay(history) {
            const zone = document.getElementById('zone-mes-grilles'); zone.innerHTML = "";
            mesCartes.forEach((grille, index) => {
                let html = `<div class="grille-container"><p style="margin:0; font-weight:bold; color:var(--gasy-green);">Karatra #${index+1}</p>`;
                grille.forEach(ligne => {
                    html += `<div class="tsipika-9">`;
                    ligne.forEach(num => {
                        if (num === "") html += `<div class="case-9 banga"></div>`;
                        else {
                            let lanyClass = history.includes(num) ? "lany" : "";
                            html += `<div class="case-9 ${lanyClass}">${num}</div>`;
                        }
                    });
                    html += `</div>`;
                });
                zone.innerHTML += html + `</div>`;
            });
        }
    </script>
</body>
</html>
